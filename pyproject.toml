[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depshield"
version = "0.1.0"
description = "Zero-critical-vulnerabilities pipeline for distributed systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "DepShield Contributors"}
]

dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "packaging>=23.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
depshield = "depshield.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["depshield"]

[tool.black]
line-length = 100

[tool.ruff]
select = ["E", "F", "W", "I"]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
